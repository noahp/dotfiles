- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- link:
    ~/.antidote: third-party/antidote
    ~/.config/kitty/kitty.conf: kitty/kitty.conf
    ~/.config/lazygit/config.yml: lazygit/config.yml
    ~/.config/nvim/init.vim: vim/.vimrc
    ~/.claude/CLAUDE.md: ai/AGENTS.md
    ~/.claude/statusline.js: ai/claude/statusline.js
    ~/.claude/settings.json: ai/claude/settings.json
    ~/.cmake-format.yaml: cmake-format/.cmake-format.yaml
    ~/.config/Code/User/settings.json: vscode/settings.json
    ~/AGENTS.md: ai/AGENTS.md
    ~/.gitignore: git/ignore
    ~/.ipython/profile_default/ipython_config.py: ipython/ipython_config.py
    ~/.direnvrc: direnv/.direnvrc
    ~/.gdb-cyrus-dashboard: third-party/cyrus-gdb-dashboard/.gdbinit
    ~/.gdbinit: gdb/.gdbinit
    ~/.gdbearlyinit: gdb/.gdbearlyinit
    ~/.gitconfig: git/.gitconfig
    ~/.local/bin/committime: git/committime.sh
    ~/.local/bin/commit-count-per-month.py: scripts/commit-count-per-month.py
    ~/.local/bin/maxminvers.py: scripts/maxminvers.py
    ~/.local/bin/inotify-consumers: scripts/inotify-consumers
    ~/.local/bin/dsync: scripts/dsync
    ~/.local/bin/wa: scripts/wa
    ~/.tmux.conf: tmux/.tmux.conf
    ~/.tmux/power.sh: tmux/power.sh
    ~/.tromey-gdb-helpers: third-party/tromey-gdb-helpers
    ~/.urlview: urlview/.urlview
    ~/.tiorc: tio/.tiorc
    ~/.zshrc: zsh/.zshrc
    ~/.zsh_plugins.txt: zsh/.zsh_plugins.txt
    ~/.p10k.zsh: zsh/.p10k.zsh

- shell:
    # rm first: an old ~/.zfunc/_rg may be a dangling symlink into the removed
    # ripgrep submodule, and the redirect would follow it
    - command: >-
        command -v rg >/dev/null || exit 0;
        mkdir -p ~/.zfunc && rm -f ~/.zfunc/_rg && rg --generate complete-zsh > ~/.zfunc/_rg
      description: Generate ripgrep zsh completion
    # see the script for optional behavior. by default no action taken
    - command: bash install-extras.sh
      stdout: true
      stderr: true
      description: Install extras. By default no action, set DOTFILES_INSTALL_ALL=y to install all!
