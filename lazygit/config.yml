# skip "Press enter to return to lazygit" after editor exits (still shown on error)
promptToReturnFromSubprocess: false
git:
  pagers:
    - pager: delta --dark --paging=never
os:
  # inline diff overlay via mini.diff (see vimrc)
  edit: 'NVIM_DIFF_OVERLAY=1 nvim -- {{filename}}'
  editAtLine: 'NVIM_DIFF_OVERLAY=1 nvim +{{line}} -- {{filename}}'
  editInTerminal: true
