name: main-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install-all
        run: ./install-all
        env:
          DOTBOT_NO_SUBMODULE_UPDATE: 1
          DOTFILES_INSTALL_VSCODE_EXTS: n
